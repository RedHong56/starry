services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: starry
      POSTGRES_USER: starry
      POSTGRES_PASSWORD: starry
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - db

volumes:
  postgres_data:
